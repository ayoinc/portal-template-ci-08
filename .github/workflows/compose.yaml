name: Docker Compose

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compose:
    name: Start the stack and call the API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Returns when every service reports healthy.
      - name: Build and start every service
        run: docker compose up --build --wait --wait-timeout 300

      - name: Call the readiness endpoint
        run: curl --fail --silent --show-error http://localhost:8000/health/ready

      - name: Create, read and delete an item through the API
        run: bash scripts/smoke.sh http://localhost:8000

      - name: Logs of the services
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
