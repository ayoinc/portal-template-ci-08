# Local stack: the service, its database, Redis.
#   docker compose up --build --wait
services:
  app:
    build: .
    ports:
      - '8000:8000'
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/app
      REDIS_URL: redis://redis:6379/0
    # Apply the migrations, then start the server.
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log
    # Checked more often than the HEALTHCHECK of the image so that
    # `docker compose up --wait` returns soon after the server is up.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready --username app --dbname app']
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  db-data:
