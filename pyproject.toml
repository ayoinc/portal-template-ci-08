[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sample-python-api"
version = "0.1.0"
description = "The sample team's \"items\" API: stores, caches and serves items"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<1",
    "pydantic-settings>=2.16,<3",
    "uvicorn[standard]>=0.54,<1",
    "sqlalchemy[asyncio]>=2.1,<3",
    "asyncpg>=0.32,<1",
    "alembic>=1.20,<2",
    "redis>=8.1,<9",
    "pyjwt>=2.15,<3",
    # Parses the form body of the token endpoint.
    "python-multipart>=0.0.33,<1",
    "limits>=5.8,<6",
    "structlog>=26.1,<27",
    "prometheus-fastapi-instrumentator>=8.1,<9",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=9.2,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    # The tests run on in-memory SQLite.
    "aiosqlite>=0.22,<1",
    "fakeredis>=2.40,<3",
    "ruff==0.17.4",
    "mypy==2.4.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
# SQLAlchemy runs database calls in greenlets; without this their lines count as missed.
concurrency = ["thread", "greenlet"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and use fixed example credentials.
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "migrations"]
plugins = ["pydantic.mypy"]
